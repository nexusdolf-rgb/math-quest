# Configuration Netlify pour Math Quest (site 100% statique)

# Le service worker doit toujours être récupéré à jour pour propager
# les nouvelles versions du jeu aux joueurs.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Les dossiers css/ js/ icons/ sont de vrais fichiers : on ne met PAS
# de redirection globale vers index.html (pour avoir de vrais 404 si
# un fichier manque, au lieu de renvoyer silencieusement la page).
